<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié | SchoolConnect</title>
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/connexion.css">
</head>
<body>
<main class="login">
<section class="intro">
<h1>SchoolConnect</h1>
<p>Saisissez l'adresse e-mail de votre compte. Si elle existe, vous recevrez un lien pour choisir un nouveau mot de passe.</p>
</section>
<section class="panel">
<h2>Mot de passe oublié</h2>
<div class="mssg success" role="status" hidden>Si ce compte existe, un e-mail vient d'être envoyé.</div>
<form action="#" method="post" novalidate>
<!-- Jeton CSRF ajouté avec le backend -->
<p><label for="email">Adresse e-mail</label><input type="email" id="email" name="email" placeholder="nom@exemple.com" autocomplete="username" required></p>
<button type="submit" class="btn">Envoyer le lien</button>
</form>
<p class="aide"><a href="connexion.html">Retour à la connexion</a></p>
</section>
</main>
</body>
</html>
