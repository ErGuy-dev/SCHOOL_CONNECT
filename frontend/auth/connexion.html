
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion | SchoolConnect</title>

    <!-- Feuilles de style -->
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/connexion.css">
</head>

<body>
    <main class="login">

        <!-- Présentation de SchoolConnect -->
        <section class="intro">
            <h1>SchoolConnect</h1>

            <p>
                La plateforme qui rapproche l'école et les familles :
                résultats, bulletins, copies corrigées et annonces,
                accessibles en toute sécurité.
            </p>
        </section>

        <!-- Formulaire de connexion -->
        <section class="panel">
            <h2>Connexion</h2>

            <!-- Message de succès ou d'erreur -->
            <div
                id="message"
                class="mssg err"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form id="form" action="#" method="post" novalidate>

                <!-- Adresse e-mail -->
                <p>
                    <label for="email">Adresse e-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="nom@exemple.com"
                        autocomplete="username"
                        maxlength="190"
                        required
                    >
                </p>

                <!-- Mot de passe -->
                <p>
                    <label for="pwd">Mot de passe</label>

                    <input
                        type="password"
                        id="pwd"
                        name="password"
                        placeholder="Votre mot de passe"
                        autocomplete="current-password"
                        required
                    >
                </p>

                <!-- Bouton de connexion -->
                <button type="submit" class="btn">
                    Se connecter
                </button>
            </form>

            <!-- Récupération du mot de passe -->
            <p class="aide">
                <a href="mot-de-passe-oublie.html">
                    Mot de passe oublié ?
                </a>
            </p>
        </section>
    </main>

    <!-- JavaScript : communication avec le backend PHP -->
    <script src="../assets/js/login.js"></script>
</body>
</html>
